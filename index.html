<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkanoid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="800" height="600"></canvas>

    <button id="btn-sound-toggle" aria-label="Activar/desactivar sonido">🔊</button>

    <div id="overlay-start" class="overlay">
      <h1>Arkanoid</h1>
      <p>Flechas / A-D o ratón para mover la pala.<br>Espacio o clic para lanzar la bola.<br>P para pausar.</p>
      <button id="btn-start">Empezar</button>
    </div>

    <div id="overlay-pause" class="overlay hidden">
      <h1>Pausa</h1>
      <p>Pulsa P o Escape para reanudar</p>
    </div>

    <div id="overlay-gameover" class="overlay hidden">
      <h1>Game Over</h1>
      <p id="gameover-score"></p>
      <button id="btn-restart-gameover">Reiniciar</button>
    </div>

    <div id="overlay-win" class="overlay hidden">
      <h1>¡Victoria!</h1>
      <p id="win-score"></p>
      <button id="btn-restart-win">Reiniciar</button>
    </div>
  </div>
  <script src="assets/spritesheet.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
